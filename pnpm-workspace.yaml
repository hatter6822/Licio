packages:
  - "apps/*"
  - "packages/*"

# pnpm settings live in THIS file: pnpm >= 10 no longer reads its settings
# from .npmrc or package.json's `pnpm` field (the former .npmrc keys were
# migrated here when pnpm 11 silently stopped honoring them).
autoInstallPeers: false
strictPeerDependencies: true
shamefullyHoist: false
resolutionMode: highest
preferFrozenLockfile: true
enablePrePostScripts: false

# Doctrine: dependency install scripts NEVER run (CLAUDE.md dependency
# checklist).  These two dev-tool packages declare build scripts that this
# project intentionally does not execute (esbuild's platform binary comes
# from its optionalDependencies; lefthook is driven by the root `prepare`
# script).  `false` declares that decision — pnpm 11 hard-fails an install
# whose ignored builds are UNDECLARED (ERR_PNPM_IGNORED_BUILDS), and it uses
# this `allowBuilds` map (the pnpm 10-era only/ignoredBuiltDependencies lists
# are no longer read).
allowBuilds:
  esbuild: false
  lefthook: false

# Security/peer pins (rationale + drop conditions: CLAUDE.md "Pinned dependencies").
overrides:
  esbuild: ^0.28.1
  undici: ^7.28.0
  ws: ^8.21.0
