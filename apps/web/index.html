<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Defense-in-depth CSP + Trusted Types mirrored as a meta-equivalent of the
      server `Content-Security-Policy` header (apps/api security-headers.ts), for the
      enforceable-in-meta directives only (frame-ancestors / report-uri / report-to
      are header-only and intentionally omitted).  On the web this is redundant with
      the header (identical policy → no behaviour change); it is the SOLE CSP source
      in the WS-R.15.4a native courier WebView, which serves these same bundled
      assets from https://localhost with no server headers — so the script/object/
      base/Trusted-Types posture survives the WebView with no relaxation.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; trusted-types default dompurify licio-ugc; require-trusted-types-for 'script'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Theme-color matches the neumorphic fabric canvas in each colour scheme. -->
    <meta name="theme-color" content="#F4ECDF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1713" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Licio — social news without popularity voting" />
    <!-- Theme-aware brand favicons: the dark-ink mark on light UI, the white
         mark on dark UI (matches the in-app BrandLogo swap). -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/light_192.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/dark_192.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/assets/dark_192.png" />
    <title>Licio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
