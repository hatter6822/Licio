version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Patch updates are auto-merge candidates when all CI checks pass.
    # Auto-merge is enforced by the branch protection required-check set
    # (WS-0.6.1f), so a malicious patch cannot merge without green security jobs.
    # To enable: gh api repos/OWNER/REPO/pulls/{id}/merge or configure
    # a GitHub Actions auto-merge workflow gated on the security job.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The codeql-action sub-actions (init/analyze/…) share an on-disk config
      # stamped with the action version, so they MUST bump in lockstep. Grouping
      # them into ONE PR prevents the version-skew deadlock where a half-merged
      # split bump leaves init on release N and analyze on N+1, breaking CodeQL on
      # every open PR (the base branch's workflow runs on PR checks).
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "ci"
