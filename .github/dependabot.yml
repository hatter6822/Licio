version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # NO AUTO-MERGE.  Dependency updates land through the same human review as
    # every other change (2026-07-23 maintainer decision).  A dependency bump is
    # a supply-chain change — the one class of PR where an unreviewed merge is
    # most costly — so the convenience is not worth the bypass, and the
    # `main-review` ruleset would block it anyway: Dependabot cannot approve its
    # own pull request, and the only bypass is a repository admin.  The
    # `dependabot-auto-merge.yml` workflow that used to do this was removed
    # rather than left to fail silently on every bump.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The codeql-action sub-actions (init/analyze/…) share an on-disk config
      # stamped with the action version, so they MUST bump in lockstep. Grouping
      # them into ONE PR prevents the version-skew deadlock where a half-merged
      # split bump leaves init on release N and analyze on N+1, breaking CodeQL on
      # every open PR (the base branch's workflow runs on PR checks).
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "ci"
