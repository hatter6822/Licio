name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm biome check .
      - run: pnpm lint:security
      - run: pnpm check:policy
      - run: pnpm check:no-raw-egress
      - run: pnpm check:no-applause
      - run: pnpm check:lcap-schema-egress
      - run: pnpm check:lcap-p2p-split
      - run: pnpm check:no-p2p-server-content
      - run: pnpm check:no-private-cid-egress
      - run: pnpm check:private-rendezvous-schema
      - run: pnpm check:private-bundle-transparency
      - run: pnpm check:p2p-endpoint-rejections
      - run: pnpm check:p2p-ranking-exclusion
      - run: pnpm check:p2p-search-exclusion

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck

  lockfile-lint:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint:lockfile

  dep-budget:
    name: Dependency Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:deps

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    # Live services so the GATED integration suites run in CI too (the
    # Drizzle/Redis production adapters against the real migration chain) —
    # the in-memory unit suites never touch them.  pgvector image: the WS-F
    # chain installs the `vector` extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: licio
          POSTGRES_PASSWORD: licio_ci
          POSTGRES_DB: licio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licio -d licio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://licio:licio_ci@localhost:5432/licio_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      # WS-I.3: the ten ranking-neutrality tests as an EXPLICIT, named gate
      # (they also run inside the full suite above; this step makes the
      # pay-to-rank guarantee a visible required check on every PR and
      # before every crypto release, SPEC §30.6).
      - name: Ranking-neutrality gate (WS-I.3)
        run: pnpm check:neutrality
      # WS-O.4.5: the ensemble adversarial suite as an EXPLICIT, named gate —
      # proves the COMBINED invariants catch each catalogued attack even when
      # the primary invariant is individually fooled (it also runs inside the
      # full suite above). See docs/invariants/ADVERSARIAL-THREATS.md.
      - name: Adversarial ensemble gate (WS-O.4.5)
        run: pnpm check:adversarial
      # WS-R.5.4: the LCAP lane-scheduler invariants as an EXPLICIT, named gate —
      # C0 (trust/liveness control) can never be starved by media/bulk, and a
      # dependent object is never scheduled before its verify/render closure
      # (OFFLINE_SPEC §15.2).
      - name: LCAP scheduler gate (WS-R.5.4)
        run: pnpm check:lcap-scheduler
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-report
          path: coverage/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results
          path: test-results/

  build-and-size:
    name: Build & Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifacts
          path: |
            apps/web/dist/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-and-size]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-artifacts
          path: apps/web/dist/
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('apps/web/node_modules/@playwright/test/package.json') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter web test:e2e
      # BFF-in-the-loop authenticated WS-Q flows (WS-P harness): the config boots
      # the in-memory API e2e-server + the proxied preview itself — no extra
      # service containers needed (in-memory stores only).
      - run: pnpm --filter web test:e2e:bff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [build-and-size]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Lockfile integrity
        run: pnpm lint:lockfile
      - name: Check workspace boundaries
        run: pnpm check:workspace-deps
      - name: Security lint
        run: pnpm lint:security
      - name: Generate SBOM
        run: pnpm sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-artifacts
          path: apps/web/dist/
      - name: Validate build output
        run: pnpm exec tsx scripts/validate-build.ts
      - name: Verify AGPL license headers
        run: |
          MISSING=$(find apps/*/src packages/*/src -name '*.ts' -o -name '*.tsx' | while read f; do
            head -1 "$f" | grep -qF 'SPDX-License-Identifier' || echo "$f"
          done)
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing SPDX license headers:"
            echo "$MISSING"
            exit 1
          fi
      - name: Secret scan (tracked files)
        run: |
          SECRETS=$(git ls-files | grep -E '\.(env|pem|key|p12|pfx)$' | grep -v '.env.example' || true)
          if [ -n "$SECRETS" ]; then
            echo "ERROR: Potential secret files committed:"
            echo "$SECRETS"
            exit 1
          fi
      - name: Secret scan (file content)
        run: |
          ERRORS=""
          if git grep -lE -- '-----BEGIN[[:space:]]+(RSA|EC|DSA|OPENSSH|PGP)?[[:space:]]*PRIVATE KEY-----' -- ':!*.md' ':!lefthook.yml' 2>/dev/null; then
            ERRORS="${ERRORS}Private key header found in tracked files.\n"
          fi
          if git grep -lE 'AKIA[0-9A-Z]{16}' 2>/dev/null; then
            ERRORS="${ERRORS}AWS access key pattern found in tracked files.\n"
          fi
          if git grep -lEI '[A-Za-z0-9+/]{40,}={0,2}' -- '*.ts' '*.tsx' '*.js' -- ':!*.test.*' ':!pnpm-lock.yaml' ':!*.snap' 2>/dev/null | head -5; then
            echo "WARNING: Potential high-entropy strings detected (manual review recommended)"
          fi
          if [ -n "$ERRORS" ]; then
            echo "ERROR: Secret patterns detected:"
            echo -e "$ERRORS"
            exit 1
          fi
      - name: Check for install scripts
        run: |
          SCRIPTS=$(pnpm ls --json --depth 0 2>/dev/null | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/dev/stdin', 'utf8'));
            const entries = Array.isArray(data) ? data : [data];
            for (const pkg of entries) {
              for (const [name, info] of Object.entries(pkg.dependencies || {})) {
                try {
                  const pkgJson = JSON.parse(fs.readFileSync('node_modules/.pnpm/node_modules/' + name + '/package.json', 'utf8'));
                  const scripts = pkgJson.scripts || {};
                  const hasInstallScripts = scripts.preinstall || scripts.install || scripts.postinstall;
                  if (hasInstallScripts) console.log(name + ': ' + JSON.stringify({preinstall: scripts.preinstall, install: scripts.install, postinstall: scripts.postinstall}));
                } catch {}
              }
            }
          " || true)
          if [ -n "$SCRIPTS" ]; then
            echo "WARNING: Packages with install scripts detected (review required):"
            echo "$SCRIPTS"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.cdx.json

  courier-apk:
    # WS-R.15.4a — the native Android courier shell builds a debug APK from the
    # UNCHANGED web build (the `check-no-fork` gate proves byte-identity).  The
    # Android SDK is installed directly from dl.google.com (no third-party action —
    # the project's minimal-supply-chain posture); JDK 21 is the runner's preinstalled
    # one.  Capacitor/native deps live only in apps/courier (build/native scope), so
    # the web <15 dep budget and the <200 KB initial-bundle gate are unaffected.
    name: Native Courier APK (WS-R.15.4a)
    runs-on: ubuntu-latest
    needs: [build-and-size]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The courier loads the UNCHANGED web build — reuse the build-and-size artifact
      # (no courier-local web fork; the no-fork gate asserts byte-identity).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-artifacts
          path: apps/web/dist/
      - name: Use the runner's JDK 21 (Capacitor 7 / AGP 8.7)
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Cache Android SDK + Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/android-sdk
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-courier-${{ runner.os }}-${{ hashFiles('apps/courier/android/gradle/wrapper/gradle-wrapper.properties', 'apps/courier/android/**/*.gradle', 'apps/courier/android/variables.gradle') }}
          restore-keys: android-courier-${{ runner.os }}-
      - name: Set up the Android SDK from dl.google.com
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          # `yes` keeps writing "y" until sdkmanager closes stdin after the last license, so it
          # exits on a broken pipe (SIGPIPE/EPIPE).  Under `pipefail` that non-zero fails the step
          # (`yes: standard output: Broken pipe`), so drop pipefail for JUST this pipeline — the
          # verdict is then sdkmanager's own exit (a real license failure still aborts the step).
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > apps/courier/android/local.properties
      - name: Build the debug APK (runs the no-fork integrity gate first)
        run: pnpm --filter courier build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: courier-apk
          path: apps/courier/android/app/build/outputs/apk/debug/app-debug.apk
