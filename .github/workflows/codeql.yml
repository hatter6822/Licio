name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # JavaScript/TypeScript is interpreted — CodeQL analyzes the source directly,
      # so `build-mode: none` replaces the `autobuild` step (faster, and it drops a
      # sub-action that would otherwise have to be version-matched to `init`).
      # EVERY codeql-action pin MUST stay on the SAME release: `init` writes a
      # config file stamped with its version that the later step verifies, so a
      # mismatch fails the run ("Loaded a configuration file for version X, but
      # running version Y"). Dependabot groups these pins so they can never drift
      # out of lockstep again (see .github/dependabot.yml, `codeql-action` group).
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
