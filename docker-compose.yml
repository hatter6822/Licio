services:
  postgres:
    # pgvector-enabled PostgreSQL 16 (WS-F.3.2b: the `vector` extension is part
    # of the migration chain; the stock postgres image does not bundle it).
    # pgvector/pgvector:pg16 is the pgvector project's official build on top of
    # the postgres:16 image — a drop-in replacement.
    # Pin to digest in production for reproducibility: docker pull pgvector/pgvector:pg16 && docker inspect --format='{{index .RepoDigests 0}}' pgvector/pgvector:pg16
    image: pgvector/pgvector:pg16
    ports:
      # LOOPBACK-ONLY, like every other service in this file. A bare
      # "5432:5432" binds 0.0.0.0, and Docker's published-port rules sit AHEAD
      # of firewalld's zone filtering — so the host's service allowlist does not
      # constrain it and the port is reachable from the whole LAN. That matters
      # more here than for a generic dev database: the role below is a
      # SUPERUSER whose password is a CI credential published in this
      # repository, so anyone on the network could reach `COPY … FROM PROGRAM`.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: licio
      POSTGRES_PASSWORD: licio_dev
      POSTGRES_DB: licio_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licio -d licio_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    # Pin to digest in production for reproducibility: docker pull redis:7-alpine && docker inspect --format='{{index .RepoDigests 0}}' redis:7-alpine
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    ports:
      # LOOPBACK-ONLY — see the note on the postgres port above. This store is
      # the CSRF-token and session store (apps/api/src/index.ts), so a
      # 0.0.0.0 bind hands session forgery to anyone on the LAN.
      - "127.0.0.1:6379:6379"
    # `--requirepass` is defence in depth BEHIND the loopback bind, not a
    # substitute for it: the bind is what removes the exposure, the password is
    # what keeps a future `docker run -p` or a compose override from silently
    # re-opening an UNAUTHENTICATED store. Anything reaching this port must now
    # present a credential.
    # LIST form rather than the string form, and the password gets its own
    # element. The string form is shell-split after interpolation, which EATS A
    # BACKSLASH: a `a\b` password reaches redis-server as `ab` while
    # REDISCLI_AUTH below keeps `a\b` verbatim, so the server and its own
    # healthcheck disagree about the credential and the container never turns
    # healthy — a failure that points at Redis rather than at the password.
    # A list element is one argv slot and is never re-split. (Spaces survive
    # either form; a double quote breaks BOTH at YAML parse, which no command
    # form can fix — .env.example's `openssl rand -hex 32` is the answer there.)
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:-licio_dev}"
    environment:
      # redis-cli reads REDISCLI_AUTH itself, so the healthcheck below stays
      # byte-identical to the unauthenticated one instead of growing an `-a`
      # flag (which also prints a warning to stderr on every probe). This is a
      # LEGIBILITY choice, not a secrecy one: `--requirepass` above already puts
      # the password in redis-server's argv, and a dev-compose password that
      # `docker inspect` reveals is not pretending to be a production secret.
      REDISCLI_AUTH: "${REDIS_PASSWORD:-licio_dev}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- The WS-U/WS-T governance-LLM LOCAL runtime (OpenAI-compatible
  # /v1/chat/completions) — the backend PRODUCTION defaults to when
  # GOVERNANCE_LLM_PROVIDER is unset, running TWO role lanes (the
  # moderation/adjudication split). vLLM serves ONE model per instance, so the
  # `llm` profile provisions one instance per lane, matching the API boot's
  # per-lane defaults exactly. OPT-IN (a plain `docker compose up -d` never
  # starts them):
  #   docker compose --profile llm up -d      (or: pnpm setup:llm --docker)
  # A FIRST start downloads the model weights from huggingface.co into the
  # shared hf-cache volume (the 27B adjudication model is tens of GB). Both
  # ports publish on the LOOPBACK interface ONLY — the `local` backend doctrine
  # is that governed-room content never leaves the host. vLLM requires a GPU
  # (the device reservations below). SINGLE-GPU HOSTS: both instances land on
  # the same card, so each declares a --gpu-memory-utilization FRACTION
  # (defaults below: 0.25 + 0.65) — without the split, vLLM's 0.9 default
  # would OOM the second instance. Multi-GPU hosts pin one card per lane via a
  # compose override setting CUDA_VISIBLE_DEVICES per service (and may raise
  # the fractions to 0.9). Size the adjudication card for the 27B default, or
  # override VLLM_ADJUDICATION_MODEL / add a quantization flag for your
  # hardware. Each lane's model resolves VLLM_*_MODEL →
  # GOVERNANCE_LLM_*_MODEL → the reviewed default, so the governance key the
  # API resolves also drives what the container serves. The single-URL
  # CPU-friendly alternative is the `llm-ollama`
  # profile below (`pnpm setup:llm --runtime ollama --docker`).
  vllm-moderation:
    # Pin to digest in production for reproducibility: docker pull vllm/vllm-openai:v0.25.1 && docker inspect --format='{{index .RepoDigests 0}}' vllm/vllm-openai:v0.25.1
    image: vllm/vllm-openai:v0.25.1
    profiles: ["llm"]
    command:
      - "--model"
      - "${VLLM_MODERATION_MODEL:-${GOVERNANCE_LLM_MODERATION_MODEL:-Qwen/Qwen3Guard-Gen-4B}}"
      - "--served-model-name"
      - "${VLLM_MODERATION_MODEL:-${GOVERNANCE_LLM_MODERATION_MODEL:-Qwen/Qwen3Guard-Gen-4B}}"
      # Right-size the context for the governed surfaces (prompts ≤ ~2.5k
      # tokens; the guard classifies one contribution at a time).
      - "--max-model-len"
      - "8192"
      # The single-GPU co-residency split (see the header comment).
      - "--gpu-memory-utilization"
      - "${VLLM_MODERATION_GPU_FRACTION:-0.25}"
    environment:
      # Optional hub token (rate-limit headroom for the weight download only;
      # the platform never selects gated models).
      HF_TOKEN: "${HF_TOKEN:-}"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    # vLLM uses shared memory for tensor transfer; the default 64 MB starves it.
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      # Weight download + load on first start can take a long while.
      start_period: 600s
    restart: unless-stopped

  vllm-adjudication:
    # Pin to digest in production for reproducibility (same digest note as above).
    image: vllm/vllm-openai:v0.25.1
    profiles: ["llm"]
    command:
      - "--model"
      - "${VLLM_ADJUDICATION_MODEL:-${GOVERNANCE_LLM_ADJUDICATION_MODEL:-Qwen/Qwen3.6-27B}}"
      - "--served-model-name"
      - "${VLLM_ADJUDICATION_MODEL:-${GOVERNANCE_LLM_ADJUDICATION_MODEL:-Qwen/Qwen3.6-27B}}"
      - "--max-model-len"
      - "8192"
      # The single-GPU co-residency split (see the header comment).
      - "--gpu-memory-utilization"
      - "${VLLM_ADJUDICATION_GPU_FRACTION:-0.65}"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  # --- The SAME two vLLM role lanes on an AMD GPU (`llm-rocm` profile).
  # AMD's official ROCm vLLM build (rocm/vllm) speaks the identical
  # OpenAI-compatible protocol on the identical loopback ports, so the API
  # boot, `pnpm setup:llm --docker --rocm`, and the dev lane probe all work
  # unchanged — dev exercises the full production vLLM path on AMD hardware.
  # The default image tag is the gfx110X build (Radeon RX 7900 class); other
  # AMD GPU classes override VLLM_ROCM_IMAGE (the broader `rdna` tag, or the
  # `cdna` tags for MI200/MI300 datacenter hosts). ROCm containers need the
  # kfd/dri devices + video/render groups instead of the NVIDIA device
  # reservation. Model defaults are IDENTICAL to
  # the `llm` profile (the reviewed lane pair). Each lane's model resolves
  # VLLM_*_MODEL → GOVERNANCE_LLM_*_MODEL → the reviewed default, so setting
  # the ONE governance key the API boot and `pnpm setup:llm` already resolve
  # keeps the served model and the requested model in lockstep by
  # construction (VLLM_*_MODEL stays a container-only override). On a 24 GB
  # consumer card the 27B adjudication default does not fit: set
  # GOVERNANCE_LLM_ADJUDICATION_MODEL to the bench-selected
  # Qwen/Qwen3-4B-Instruct-2507 (measured optimal for this envelope;
  # Qwen/Qwen3-8B-AWQ is the verified alternative, and 14B-AWQ/27B cannot
  # serve the 8192 context co-resident — see docs/DEVELOPMENT.md §17.7) and
  # re-balance the GPU fractions (0.42 / 0.50, measured on a 24 GB
  # RX 7900 XTX — the guard's 4B bf16 weights plus the 8192-context KV cache
  # exceed the 0.25 default's budget).
  vllm-moderation-rocm:
    image: "${VLLM_ROCM_IMAGE:-rocm/vllm:rocm7.13.0_gfx110X-all_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1}"
    profiles: ["llm-rocm"]
    command:
      - "vllm"
      - "serve"
      - "${VLLM_MODERATION_MODEL:-${GOVERNANCE_LLM_MODERATION_MODEL:-Qwen/Qwen3Guard-Gen-4B}}"
      - "--served-model-name"
      - "${VLLM_MODERATION_MODEL:-${GOVERNANCE_LLM_MODERATION_MODEL:-Qwen/Qwen3Guard-Gen-4B}}"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "${VLLM_MODERATION_GPU_FRACTION:-0.25}"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    # Numeric GIDs: the rocm/vllm image defines no named video/render groups.
    # `pnpm setup:llm --docker --rocm` derives both from the host's /dev/kfd +
    # /dev/dri automatically; override the env keys for a bare `docker compose`.
    group_add:
      - "${LICIO_VIDEO_GID:-39}"
      - "${LICIO_RENDER_GID:-105}"
    security_opt:
      - seccomp:unconfined
    shm_size: "8gb"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  vllm-adjudication-rocm:
    image: "${VLLM_ROCM_IMAGE:-rocm/vllm:rocm7.13.0_gfx110X-all_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1}"
    profiles: ["llm-rocm"]
    command:
      - "vllm"
      - "serve"
      - "${VLLM_ADJUDICATION_MODEL:-${GOVERNANCE_LLM_ADJUDICATION_MODEL:-Qwen/Qwen3.6-27B}}"
      - "--served-model-name"
      - "${VLLM_ADJUDICATION_MODEL:-${GOVERNANCE_LLM_ADJUDICATION_MODEL:-Qwen/Qwen3.6-27B}}"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "${VLLM_ADJUDICATION_GPU_FRACTION:-0.65}"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    # Numeric GIDs: the rocm/vllm image defines no named video/render groups.
    # `pnpm setup:llm --docker --rocm` derives both from the host's /dev/kfd +
    # /dev/dri automatically; override the env keys for a bare `docker compose`.
    group_add:
      - "${LICIO_VIDEO_GID:-39}"
      - "${LICIO_RENDER_GID:-105}"
    security_opt:
      - seccomp:unconfined
    shm_size: "8gb"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  ollama:
    # The single-URL ALTERNATIVE runtime (`llm-ollama` profile): one Ollama
    # multiplexes both role lanes' models from http://127.0.0.1:11434/v1 —
    # CPU-capable and convenient for smaller GGUF builds. Provision + verify:
    #   pnpm setup:llm --runtime ollama --docker
    # (it pulls GGUF builds of the two lane defaults and prints the env lines
    # the API boot needs). Loopback-only, as above.
    # Pin to digest in production for reproducibility: docker pull ollama/ollama:latest && docker inspect --format='{{index .RepoDigests 0}}' ollama/ollama:latest
    image: ollama/ollama:latest
    profiles: ["llm-ollama"]
    environment:
      # Keep the governed models resident: an idle-unloaded model costs a
      # multi-second cold load on the next verdict/moderation call.
      OLLAMA_KEEP_ALIVE: "-1"
      # Parallel request slots (the debate lifecycle fans adjudications out
      # 4-wide; match it so a backlog genuinely overlaps).
      OLLAMA_NUM_PARALLEL: "4"
      # Right-size the context window for the governed surfaces (prompts are
      # ≤ ~2.5k tokens). Ollama's 32k default inflates the KV cache by
      # gigabytes and can push a large model into a split CPU/GPU placement
      # that serializes every token (measured: a dense 32B fell from 30 to
      # ~6.5 tok/s that way on a 24 GB GPU).
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  hf-cache:
  ollama-data:
