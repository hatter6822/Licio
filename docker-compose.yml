services:
  postgres:
    # pgvector-enabled PostgreSQL 16 (WS-F.3.2b: the `vector` extension is part
    # of the migration chain; the stock postgres image does not bundle it).
    # pgvector/pgvector:pg16 is the pgvector project's official build on top of
    # the postgres:16 image — a drop-in replacement.
    # Pin to digest in production for reproducibility: docker pull pgvector/pgvector:pg16 && docker inspect --format='{{index .RepoDigests 0}}' pgvector/pgvector:pg16
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: licio
      POSTGRES_PASSWORD: licio_dev
      POSTGRES_DB: licio_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licio -d licio_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    # Pin to digest in production for reproducibility: docker pull redis:7-alpine && docker inspect --format='{{index .RepoDigests 0}}' redis:7-alpine
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama:
    # The WS-U/WS-T governance-LLM LOCAL runtime (OpenAI-compatible
    # /v1/chat/completions) — the backend PRODUCTION defaults to when
    # GOVERNANCE_LLM_PROVIDER is unset. OPT-IN via the `llm` compose profile
    # (a plain `docker compose up -d` never starts it):
    #   docker compose --profile llm up -d ollama
    #   pnpm setup:llm         # pulls + verifies the default model
    # Published on the LOOPBACK interface ONLY — the `local` backend doctrine
    # is that governed-room content never leaves the host, so the runtime must
    # never listen on a LAN-reachable address. For GPU inference add a
    # `deploy.resources.reservations.devices` block (NVIDIA) per the Compose
    # GPU docs; CPU works for the default model, just slower.
    # Pin to digest in production for reproducibility: docker pull ollama/ollama:latest && docker inspect --format='{{index .RepoDigests 0}}' ollama/ollama:latest
    image: ollama/ollama:latest
    profiles: ["llm"]
    environment:
      # Keep the governed model resident: an idle-unloaded model costs a
      # multi-second cold load on the next verdict/moderation call.
      OLLAMA_KEEP_ALIVE: "-1"
      # Parallel request slots (the debate lifecycle fans adjudications out
      # 4-wide; match it so a backlog genuinely overlaps).
      OLLAMA_NUM_PARALLEL: "4"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
